<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#445"/></marker>
    <style>
      .box{fill:#fff;stroke:#8895a7;stroke-width:1.4;rx:8}
      .zone{fill:#f4f7fb;stroke:#b7c3d4;stroke-dasharray:6 4;rx:12}
      .t{font-weight:700;fill:#1b2430} .s{fill:#55606e;font-size:11.5px}
      .ln{stroke:#445;stroke-width:1.5;fill:none;marker-end:url(#a)} .dash{stroke-dasharray:5 4}
      .ext{fill:#fff4e0;stroke:#d9a13b} .db{fill:#e8f1ff;stroke:#5b8fd6} .sec{fill:#fde8e6;stroke:#d36b60}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="24" y="30" class="t" font-size="18">MLOps Platform - logical architecture (G12)</text>

  <rect class="zone" x="20" y="50" width="250" height="330"/><text x="36" y="72" class="t">Client zone</text>
  <rect class="box" x="40" y="90" width="210" height="80"/><text x="56" y="116" class="t">Angular SPA</text><text x="56" y="136" class="s">Models, Deployments, Monitoring,</text><text x="56" y="152" class="s">Timeline. Talks only to /api</text>
  <rect class="box sec" x="40" y="292" width="210" height="64"/><text x="56" y="318" class="t">Identity provider (OIDC)</text><text x="56" y="337" class="s">Prod: JWT roles. Dev: X-Role header</text>
  <rect class="box" x="40" y="200" width="210" height="62"/><text x="56" y="226" class="t">Ingress / nginx</text><text x="56" y="245" class="s">TLS, /api proxy, rate limit, WAF</text>

  <rect class="zone" x="310" y="50" width="560" height="470"/><text x="326" y="72" class="t">Platform zone (Kubernetes namespace: mlops)</text>
  <rect class="box" x="335" y="90" width="510" height="150"/><text x="351" y="114" class="t">Python API (FastAPI, stateless, N replicas)</text>
  <rect class="box" x="350" y="126" width="145" height="98"/><text x="362" y="148" class="t">Registry</text><text x="362" y="166" class="s">models, versions,</text><text x="362" y="181" class="s">lifecycle, approval</text><text x="362" y="196" class="s">(separation of duties)</text>
  <rect class="box" x="510" y="126" width="160" height="98"/><text x="522" y="148" class="t">Deployments</text><text x="522" y="166" class="s">gates, idempotency,</text><text x="522" y="181" class="s">retry, rollback,</text><text x="522" y="196" class="s">promotion controls</text>
  <rect class="box" x="685" y="126" width="145" height="98"/><text x="697" y="148" class="t">Monitoring</text><text x="697" y="166" class="s">metric read model,</text><text x="697" y="181" class="s">health classification,</text><text x="697" y="196" class="s">version comparison</text>
  <rect class="box" x="335" y="262" width="510" height="100"/><text x="351" y="286" class="t">Deployment worker (async, scale-out)</text>
  <text x="351" y="306" class="s">claim REQUESTED (atomic) -> VALIDATING -> DEPLOYING -> SUCCEEDED | FAILED</text>
  <text x="351" y="324" class="s">re-checks governance - writes intent before external call - reconciler heals stuck rows</text>
  <text x="351" y="342" class="s">Assignment: in-process thread.  Target: separate Deployment / Arq / Celery / K8s Job</text>
  <rect class="box db" x="335" y="390" width="250" height="110"/><text x="351" y="414" class="t">PostgreSQL (system of record)</text><text x="351" y="433" class="s">registry, deployments, events, audit</text><text x="351" y="449" class="s">partial unique index = 1 active deploy</text><text x="351" y="465" class="s">row_version optimistic locking</text><text x="351" y="481" class="s">metric_points partitioned by time</text>
  <rect class="box db" x="600" y="390" width="245" height="110"/><text x="616" y="414" class="t">Queue + cache (target)</text><text x="616" y="433" class="s">Redis / SQS: work queue, hot reads</text><text x="616" y="449" class="s">DB-claim remains source of truth</text><text x="616" y="465" class="s">Outbox -> event bus for integrations</text>

  <rect class="zone" x="910" y="50" width="270" height="470"/><text x="926" y="72" class="t">External / ops zone</text>
  <rect class="box ext" x="930" y="90" width="230" height="110"/><text x="946" y="116" class="t">Model runtimes (port/adapter)</text><text x="946" y="136" class="s">KServe, SageMaker, Azure ML, Triton</text><text x="946" y="152" class="s">Assignment: SimulatedRuntime with</text><text x="946" y="168" class="s">failure injection</text>
  <rect class="box ext" x="930" y="220" width="230" height="86"/><text x="946" y="246" class="t">Model artifact store</text><text x="946" y="266" class="s">S3 / GCS / ABFS (URI + checksum)</text>
  <rect class="box ext" x="930" y="326" width="230" height="86"/><text x="946" y="352" class="t">Metric producers</text><text x="946" y="372" class="s">runtime exporters / Kafka -> aggregator</text>
  <rect class="box" x="930" y="432" width="230" height="70"/><text x="946" y="458" class="t">Observability stack</text><text x="946" y="478" class="s">Prometheus, Grafana, OTel, Loki</text>

  <path class="ln" d="M145 170 V200"/>
  <path class="ln" d="M250 231 H335"/>
  <path class="ln dash" d="M145 292 V262"/>
  <path class="ln" d="M590 240 V262"/><path class="ln" d="M460 362 V390"/><path class="ln" d="M770 362 V390"/>
  <path class="ln" d="M845 312 H890 V150 H930"/>
  <path class="ln dash" d="M845 445 H890 V467 H930"/>
  <rect class="box" x="20" y="550" width="1160" height="190"/><text x="36" y="574" class="t">Key flows and guarantees</text>
  <text x="36" y="598" class="s">1. POST /deployments (Idempotency-Key) -> synchronous gates (approved? staging done? role?) -> persist REQUESTED + event + audit in ONE transaction -> 202.</text>
  <text x="36" y="618" class="s">2. Worker atomically claims the row, re-validates governance, records runtime_call_started (token = deployment id) BEFORE calling the runtime, then commits result + stage changes atomically.</text>
  <text x="36" y="638" class="s">3. Crash between runtime success and DB commit -> reconciler asks the runtime by token; adopts the truth (SUCCEEDED) or fails as RECONCILIATION (retryable).</text>
  <text x="36" y="658" class="s">4. Rollback = a new, audited deployment to previous_version; allowed only for the live, non-rollback deployment with an approved target; one active deployment per (model, env) enforced by the DB.</text>
  <text x="36" y="678" class="s">5. Every request carries X-Correlation-ID -> JSON logs, events, audit rows and UI error toasts share it. Failures are classified TRANSIENT / PERMANENT / RECONCILIATION.</text>
  <text x="36" y="698" class="s">6. Angular depends only on the REST contract (OpenAPI) through one ApiService; backend modules/DB can change without touching the UI.</text>
  <text x="36" y="724" class="s">Legend: blue = data stores, orange = external systems, red = auth boundary, dashed = async / optional.</text>
</svg>
