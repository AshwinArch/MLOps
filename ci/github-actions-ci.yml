name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: lint-imports
      - run: python -m pytest --cov=app --cov-fail-under=85
      - run: pip-audit -r requirements.lock
  backend-postgres:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mlops, POSTGRES_PASSWORD: ci-${{ github.run_id }}, POSTGRES_DB: mlops_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlops" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mlops:ci-${{ github.run_id }}@localhost:5432/mlops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: |
          PGPASSWORD=ci-${{ github.run_id }} psql -h localhost -U mlops -d mlops_test -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          export DATABASE_URL=$TEST_DATABASE_URL
          alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - run: npx ng build --configuration production
      - run: npm audit --audit-level=high --omit=dev
  k8s-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/app.yaml
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile -t mlops-frontend .
      - name: nginx serves the SPA, has security headers and 404s missing assets
        run: |
          docker run -d --name fe -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 mlops-frontend
          sleep 3
          curl -fsS localhost:8080/ | grep -qi "<app-root"
          curl -fsSI localhost:8080/ | grep -qi "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/missing.js)" = 404
  compose:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, k8s-schema, image-smoke]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
